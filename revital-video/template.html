<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Revital Chitayat - video template</title>
<style>
  @font-face { font-family: "Assistant"; font-weight: 400; src: url(assets/assistant-hebrew-400-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Assistant"; font-weight: 700; src: url(assets/assistant-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Assistant"; font-weight: 800; src: url(assets/assistant-hebrew-800-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Assistant"; font-weight: 400; src: url(assets/assistant-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Assistant"; font-weight: 700; src: url(assets/assistant-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Assistant"; font-weight: 800; src: url(assets/assistant-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(assets/space-grotesk-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(assets/space-grotesk-latin-700-normal.woff2) format("woff2"); }

  :root {
    --lavender: #CDAEE4;
    --lime: #CCF359;
    --sand: #CEC3BC;
    --choc: #41262D;
    --snow: #F8F8F8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--snow); }
  body { font-family: "Assistant", sans-serif; color: var(--choc); }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .en { font-family: "Space Grotesk", sans-serif; direction: ltr; letter-spacing: .14em; text-transform: uppercase; }
  svg.waves { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg.waves path { fill: none; stroke-linecap: round; }
  .line { display: block; will-change: transform, opacity; }

  /* scene 1: logo */
  #s1 .logo { position: absolute; left: 60px; top: 760px; width: 960px; }
  #s1 .tag { position: absolute; top: 1110px; width: 100%; text-align: center; font-size: 34px; font-weight: 500; }

  /* scene 2: headline on lavender */
  #s2 { background: var(--lavender); }
  #s2 .title { position: absolute; right: 90px; top: 520px; font-weight: 800; font-size: 170px; line-height: 1.02; }
  #s2 .sub { position: absolute; right: 94px; top: 1130px; font-size: 54px; font-weight: 400; max-width: 820px; line-height: 1.3; }

  /* scene 3: three words */
  #s3 { background: var(--snow); }
  #s3 .word { position: absolute; right: 90px; font-weight: 800; font-size: 150px; }
  #s3 .chip { position: absolute; left: 90px; width: 110px; height: 110px; border-radius: 50%; }

  /* scene 4: CTA on chocolate */
  #s4 { background: var(--choc); color: var(--snow); }
  #s4 .q { position: absolute; right: 90px; top: 560px; font-size: 96px; font-weight: 800; line-height: 1.1; max-width: 900px; }
  #s4 .cta { position: absolute; right: 90px; top: 1060px; background: var(--lime); color: var(--choc); font-size: 52px; font-weight: 700; padding: 26px 64px; border-radius: 999px; }
  #s4 .foot { position: absolute; bottom: 150px; width: 100%; text-align: center; font-size: 30px; color: var(--lavender); }
</style>
</head>
<body>

<section class="scene" id="s1">
  <svg class="waves" viewBox="0 0 1080 1920">
    <path id="w1a" d="M -80 420 C 180 220, 360 620, 600 400 S 980 220, 1160 460" stroke="#CDAEE4" stroke-width="70"/>
    <path id="w1b" d="M -80 1560 C 200 1380, 420 1760, 660 1560 S 1000 1400, 1160 1620" stroke="#CCF359" stroke-width="70"/>
  </svg>
  <img class="logo" src="assets/logo.png" alt="Revital Chitayat">
  <div class="tag en line">Ideas · People · Impact</div>
</section>

<section class="scene" id="s2">
  <svg class="waves" viewBox="0 0 1080 1920">
    <path id="w2" d="M 1160 1700 C 860 1500, 760 1880, 480 1640 S 80 1420, -80 1600" stroke="#CCF359" stroke-width="80"/>
  </svg>
  <div class="title"><span class="line">מנהיגות</span><span class="line">בעידן</span><span class="line">החדש</span></div>
  <div class="sub line">[משפט מפתח מתוך ההקלטה של רויטל]</div>
</section>

<section class="scene" id="s3">
  <svg class="waves" viewBox="0 0 1080 1920">
    <path id="w3" d="M -80 1500 C 240 1300, 300 1760, 600 1560 S 900 1300, 1160 1480" stroke="#41262D" stroke-width="60"/>
  </svg>
  <div class="word line" style="top:420px">רעיונות</div><div class="chip" style="top:470px;background:var(--lavender)"></div>
  <div class="word line" style="top:700px">אנשים</div><div class="chip" style="top:750px;background:var(--lime)"></div>
  <div class="word line" style="top:980px">השפעה</div><div class="chip" style="top:1030px;background:var(--sand)"></div>
</section>

<section class="scene" id="s4">
  <svg class="waves" viewBox="0 0 1080 1920">
    <path id="w4a" d="M -80 300 C 200 120, 420 480, 680 300 S 1000 140, 1160 320" stroke="#CDAEE4" stroke-width="70"/>
    <path id="w4b" d="M 1160 1500 C 900 1320, 760 1680, 500 1500 S 100 1360, -80 1520" stroke="#CCF359" stroke-width="70"/>
  </svg>
  <div class="q line">[קריאה לפעולה: הצטרפו לקורס]</div>
  <div class="cta line">[להרשמה]</div>
  <div class="foot en line">Revital Chitayat</div>
</section>

<script>
  // Deterministic timeline: render.js calls window.seek(t) per frame.
  const DUR = 12;
  const scenes = [
    { el: "s1", from: 0,  to: 3.2 },
    { el: "s2", from: 3.0, to: 6.4 },
    { el: "s3", from: 6.2, to: 9.4 },
    { el: "s4", from: 9.2, to: 12 },
  ];
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const prog = (t, a, b) => ease((t - a) / (b - a));

  document.querySelectorAll("svg.waves path").forEach((p) => {
    const len = p.getTotalLength();
    p.dataset.len = len;
    p.style.strokeDasharray = len;
  });
  const draw = (id, k) => {
    const p = document.getElementById(id);
    p.style.strokeDashoffset = p.dataset.len * (1 - k);
  };
  const rise = (el, k, dist = 80) => {
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * dist}px)`;
  };

  window.seek = (t) => {
    for (const s of scenes) {
      const el = document.getElementById(s.el);
      const fade = Math.min(prog(t, s.from, s.from + 0.25), 1 - prog(t, s.to - 0.25, s.to));
      el.style.opacity = s.from === 0 ? (t < s.to - 0.25 ? 1 : fade) : fade;
    }
    // s1
    draw("w1a", prog(t, 0, 1.4));
    draw("w1b", prog(t, 0.3, 1.7));
    const logo = document.querySelector("#s1 .logo");
    const kl = prog(t, 0.6, 1.6);
    logo.style.opacity = kl;
    logo.style.transform = `scale(${0.92 + 0.08 * kl})`;
    rise(document.querySelector("#s1 .tag"), prog(t, 1.4, 2.2), 40);
    // s2
    document.querySelectorAll("#s2 .title .line").forEach((l, i) => rise(l, prog(t, 3.2 + i * 0.25, 3.9 + i * 0.25)));
    rise(document.querySelector("#s2 .sub"), prog(t, 4.4, 5.1), 40);
    draw("w2", prog(t, 3.3, 5.0));
    // s3
    document.querySelectorAll("#s3 .word").forEach((l, i) => rise(l, prog(t, 6.4 + i * 0.5, 7.0 + i * 0.5)));
    document.querySelectorAll("#s3 .chip").forEach((c, i) => {
      const k = prog(t, 6.6 + i * 0.5, 7.1 + i * 0.5);
      c.style.transform = `scale(${k})`;
    });
    draw("w3", prog(t, 6.6, 8.6));
    // s4
    draw("w4a", prog(t, 9.3, 10.6));
    draw("w4b", prog(t, 9.5, 10.8));
    rise(document.querySelector("#s4 .q"), prog(t, 9.5, 10.2));
    rise(document.querySelector("#s4 .cta"), prog(t, 10.2, 10.8), 40);
    rise(document.querySelector("#s4 .foot"), prog(t, 10.6, 11.2), 20);
  };
  window.DURATION = DUR;
  window.seek(0);
</script>
</body>
</html>
